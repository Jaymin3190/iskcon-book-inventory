<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>ISKCON Book Inventory &amp; Distribution</title>
<link rel="stylesheet" href="style.css?v=37">
</head>
<body>
<div id="loginView">
  <div class="login-card">
    <div class="login-brand">
      <span class="login-mark" aria-hidden="true">IB</span>
      <span class="login-brand-name">ISKCON<small>BOOK DISTRIBUTION</small></span>
    </div>
    <div class="login-heading">
      <p class="login-eyebrow">Inventory management</p>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to manage your books and stock.</p>
    </div>
    <label for="loginUser">Username</label>
    <input id="loginUser" placeholder="Enter your username" autocomplete="username">
    <label for="loginPass">Password</label>
    <input id="loginPass" type="password" placeholder="Enter your password" autocomplete="current-password">
    <button id="loginBtn">Sign in <span aria-hidden="true">&rarr;</span></button>
    <p id="loginError" class="error"></p>
    <p class="login-footer">Book Inventory &amp; Distribution Management System</p>
  </div>
</div>

<div id="appView" hidden>
  <div id="sidebarOverlay" hidden></div>
  <aside id="sidebar" class="sidebar" aria-label="Application menu">
    <div class="sidebar-brand">
      <span class="sidebar-mark" aria-hidden="true">IB</span>
      <span>
        <strong>ISKCON</strong>
        <small>Book Distribution</small>
      </span>
    </div>
    <nav id="tabs" aria-label="Main navigation"></nav>
    <div class="sidebar-user">
      <div class="sidebar-user-row">
        <span id="sidebarAvatar" class="user-avatar" aria-hidden="true">U</span>
        <span id="sidebarUserInfo" class="sidebar-user-info"></span>
      </div>
      <button id="sidebarLogout" class="sidebar-logout" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span>Logout</span>
      </button>
    </div>
  </aside>
  <div class="app-main">
    <header class="topbar">
      <div class="topbar-inner">
        <button id="menuToggle" type="button" aria-controls="sidebar" aria-expanded="false">
          <span aria-hidden="true">&#9776;</span>
          <span>Menu</span>
        </button>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="topbar-user">
          <span id="userInfo" class="topbar-user-info"></span>
          <span id="userAvatar" class="user-avatar topbar-avatar" aria-hidden="true">U</span>
          <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
        </div>
      </div>
    </header>
    <main id="content"></main>
  </div>
</div>

<div id="modalBackdrop" hidden>
  <div id="modalBox"></div>
</div>

<div id="toast" hidden></div>

<script src="app.js?v=31"></script>
</body>
</html>
