<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="apple-touch-icon" href="favicon-180.png?v=2">
<title>ISKCON Jamnagar Book Management</title>
<link rel="stylesheet" href="style.css?v=65">
</head>
<body>
<div id="loginView">
  <div class="login-card">
    <div class="login-brand">
      <span class="login-mark" aria-hidden="true"><svg viewBox="8 14 48 40" aria-hidden="true" focusable="false"><path d="M31 21c-6-3-13-4-20-3v28c7-1 14 0 20 3z" fill="#f6efe1"/><path d="M33 21c6-3 13-4 20-3v28c-7-1-14 0-20 3z" fill="#efe0c6"/><path d="M32 21v28" stroke="#c9a77b" stroke-width="2.4" stroke-linecap="round"/><g stroke="#d8bf97" stroke-width="1.3" stroke-linecap="round" fill="none"><path d="M16 25c3.5-.6 7 .1 10 1.6"/><path d="M16 31c3.5-.6 7 .1 10 1.6"/><path d="M16 37c3.5-.6 7 .1 10 1.6"/><path d="M48 25c-3.5-.6-7 .1-10 1.6"/><path d="M48 31c-3.5-.6-7 .1-10 1.6"/><path d="M48 37c-3.5-.6-7 .1-10 1.6"/></g></svg></span>
      <span class="login-brand-name">ISKCON<small>JAMNAGAR BOOK MANAGEMENT</small></span>
    </div>
    <div class="login-heading">
      <p class="login-eyebrow">Inventory management</p>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to manage your books and stock.</p>
    </div>
    <label for="loginUser">Username</label>
    <input id="loginUser" placeholder="Enter your username" autocomplete="username">
    <label for="loginPass">Password</label>
    <input id="loginPass" type="password" placeholder="Enter your password" autocomplete="current-password">
    <button id="loginBtn">Sign in <span aria-hidden="true">&rarr;</span></button>
    <p id="loginError" class="error"></p>
    <p class="login-footer">ISKCON Jamnagar Book Management</p>
  </div>
</div>

<div id="appView" hidden>
  <div id="sidebarOverlay" hidden></div>
  <aside id="sidebar" class="sidebar" aria-label="Application menu">
    <div class="sidebar-brand">
      <span class="sidebar-mark" aria-hidden="true"><svg viewBox="8 14 48 40" aria-hidden="true" focusable="false"><path d="M31 21c-6-3-13-4-20-3v28c7-1 14 0 20 3z" fill="#f6efe1"/><path d="M33 21c6-3 13-4 20-3v28c-7-1-14 0-20 3z" fill="#efe0c6"/><path d="M32 21v28" stroke="#c9a77b" stroke-width="2.4" stroke-linecap="round"/><g stroke="#d8bf97" stroke-width="1.3" stroke-linecap="round" fill="none"><path d="M16 25c3.5-.6 7 .1 10 1.6"/><path d="M16 31c3.5-.6 7 .1 10 1.6"/><path d="M16 37c3.5-.6 7 .1 10 1.6"/><path d="M48 25c-3.5-.6-7 .1-10 1.6"/><path d="M48 31c-3.5-.6-7 .1-10 1.6"/><path d="M48 37c-3.5-.6-7 .1-10 1.6"/></g></svg></span>
      <span>
        <strong>ISKCON</strong>
        <small>Jamnagar Book Management</small>
      </span>
    </div>
    <nav id="tabs" aria-label="Main navigation"></nav>
    <div class="sidebar-user">
      <div class="sidebar-user-row">
        <span id="sidebarAvatar" class="user-avatar" aria-hidden="true">U</span>
        <span id="sidebarUserInfo" class="sidebar-user-info"></span>
      </div>
      <button id="sidebarLogout" class="sidebar-logout" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span>Logout</span>
      </button>
    </div>
  </aside>
  <div class="app-main">
    <header class="topbar">
      <div class="topbar-inner">
        <button id="menuToggle" type="button" aria-controls="sidebar" aria-expanded="false">
          <span aria-hidden="true">&#9776;</span>
          <span>Menu</span>
        </button>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="topbar-user">
          <span id="userInfo" class="topbar-user-info"></span>
          <span id="userAvatar" class="user-avatar topbar-avatar" aria-hidden="true">U</span>
          <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
        </div>
      </div>
    </header>
    <main id="content"></main>
  </div>
</div>

<div id="modalBackdrop" hidden>
  <div id="modalBox"></div>
</div>

<div id="toast" hidden></div>

<script src="app.js?v=69"></script>
</body>
</html>
