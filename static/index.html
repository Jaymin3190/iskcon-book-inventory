<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>ISKCON Book Inventory &amp; Distribution</title>
<link rel="stylesheet" href="style.css?v=17">
</head>
<body>
<div id="loginView">
  <div class="login-card">
    <div class="login-brand">
      <span class="login-mark" aria-hidden="true">IB</span>
      <span class="login-brand-name">ISKCON<small>BOOK DISTRIBUTION</small></span>
    </div>
    <div class="login-heading">
      <p class="login-eyebrow">Inventory management</p>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to manage your books and stock.</p>
    </div>
    <label for="loginUser">Username</label>
    <input id="loginUser" placeholder="Enter your username" autocomplete="username">
    <label for="loginPass">Password</label>
    <input id="loginPass" type="password" placeholder="Enter your password" autocomplete="current-password">
    <button id="loginBtn">Sign in <span aria-hidden="true">&rarr;</span></button>
    <p id="loginError" class="error"></p>
    <p class="login-footer">Book Inventory &amp; Distribution Management System</p>
  </div>
</div>

<div id="appView" hidden>
  <header>
    <div class="brand">ISKCON Book Distribution</div>
    <div class="user-box">
      <span id="userInfo"></span>
      <button id="mobileMenuToggle" class="ghost" type="button" aria-controls="tabs" aria-expanded="false">Menu</button>
      <button id="logoutBtn" class="ghost">Logout</button>
    </div>
  </header>
  <nav id="tabs" aria-label="Main navigation"></nav>
  <main id="content"></main>
</div>

<div id="modalBackdrop" hidden>
  <div id="modalBox"></div>
</div>

<div id="toast" hidden></div>

<script src="app.js?v=17"></script>
</body>
</html>
